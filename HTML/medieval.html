<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Habitantes - Año 1350</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
<rpg-navbar ruta-base=".."></rpg-navbar>
    <header>
        <h1>Censo del Año de Nuestro Señor 1350</h1>
        <p style="font-style: italic;">Gentes de fe, labriegos, artesanos y nobles. Sin magia, solo supervivencia.</p>
    </header>

    <main>
        <section>
            <h2>1. Identidad</h2>
            <div>
                <label for="med-name">Nombre y Apellidos:</label>
                <input type="text" id="med-name" placeholder="Ej. Rodrigo de Vivar, Pepita la del Mesón...">
            </div>
            
            <div>
                <label for="med-age">Edad (Años):</label>
                <input type="number" id="med-age" placeholder="Ej. 43" style="padding: 10px; border-radius: 4px; border: 1px solid var(--gold-accent); background-color: #0a0a0a; color: var(--text-light); font-family: var(--font-body);">
            </div>
        </section>

        <hr>

        <section>
            <h2>2. Apariencia Física</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 150px;">
                    <label for="med-hair">Cabello:</label>
                    <input type="text" id="med-hair" placeholder="Ej. Castaño, canoso, rapado...">
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label for="med-height">Altura:</label>
                    <input type="text" id="med-height" placeholder="Ej. Bajo, 1.60m, larguirucho...">
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label for="med-build">Complexión:</label>
                    <input type="text" id="med-build" placeholder="Ej. Fuerte, enjuto, robusta...">
                </div>
            </div>
        </section>

        <hr>

        <section>
            <h2>3. Vida y Oficio</h2>
            <div>
                <label for="med-job">Oficio y Estrato Social:</label>
                <input type="text" id="med-job" placeholder="Ej. Mesonera, Herrero, Siervo de la gleba, Monje...">
                <small style="color: gray; margin-top: 5px;">Recuerda la coherencia histórica según tu género y estatus en el siglo XIV.</small>
            </div>

            <div style="margin-top: 15px;">
                <label for="med-background">Trasfondo (Background):</label>
                <textarea id="med-background" rows="5" placeholder="Ej. Me llamo Pepita, soy la mujer del mesonero y regentamos la posada más habitada del pueblo. Soy muy devota..." style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--gold-accent); background-color: #0a0a0a; color: var(--text-light); font-family: var(--font-body); resize: vertical;"></textarea>
            </div>
        </section>

        <hr>

        <section id="character-actions">
            <button id="btn-save-med">📜 Inscribir en el Registro</button>
            <button onclick="window.location.href='index.html'">Volver al Menú</button>
            <button onclick="window.location.href='archivos.html'">🕯️ Ver Archivos Parroquiales</button>
            <button onclick="window.location.href='index.html'">🏠 Volver al Menú Principal</button>
        </section>
        </section>
    </main>

    <script src="../JS/medieval.js"></script>
    <script src="../JS/navBar.js"></script>
</body>
</html>
