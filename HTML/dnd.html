<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Personajes - D&D </title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <rpg-navbar ruta-base=".."></rpg-navbar>
    <header>
        <h1>Forja de Héroes - D&D</h1>
        <p>Crea tu personaje</p>
    </header>

    <main>
        <section id="character-identity">
            <h2>1. Identidad</h2>
            <div>
                <label for="char-name">Nombre del Personaje:</label>
                <input type="text" id="char-name" placeholder="Ej. Gandalf, Drizzt...">
            </div>

            <div>
                <label for="race-select">Elige tu Raza:</label>
                <select id="race-select">
                    <option value="">Cargando razas...</option>
                </select>
            </div>

            <div>
                <label for="class-select">Elige tu Clase:</label>
                <select id="class-select">
                    <option value="">Cargando clases...</option>
                </select>
            </div>
        </section>

        <hr>

        <section id="character-stats">
            <h2>2. Atributos</h2>
            <button id="btn-roll-stats">Lanzar Dados (Atributos Aleatorios)</button>

            <div class="stats-grid">
                <p>Fuerza (STR): <span id="stat-str">10</span> <small id="mod-str">(+0)</small></p>
                <p>Destreza (DEX): <span id="stat-dex">10</span> <small id="mod-dex">(+0)</small></p>
                <p>Constitución (CON): <span id="stat-con">10</span> <small id="mod-con">(+0)</small></p>
                <p>Inteligencia (INT): <span id="stat-int">10</span> <small id="mod-int">(+0)</small></p>
                <p>Sabiduría (WIS): <span id="stat-wis">10</span> <small id="mod-wis">(+0)</small></p>
                <p>Carisma (CHA): <span id="stat-cha">10</span> <small id="mod-cha">(+0)</small></p>
            </div>
        </section>

        <hr>

        <section id="character-visualization">
            <h2>3. Gráfico del Personaje</h2>
            <div style="max-width: 400px; margin: auto;">
                <canvas id="statsChart"></canvas>
            </div>
        </section>

        <hr>

        <section id="character-actions">
            <button id="btn-save">💾 Reclutar Personaje</button>
            <button id="btn-load">📂 Visita la taberna</button>
        </section>

    </main>
    <script src="../JS/localStorage.js"></script>
    <script src="../JS/app.js"></script>
    <script src="../JS/navBar.js"></script>
</body>

</html>
